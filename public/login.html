<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Know GOD App — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card card">
    <div class="card-body">
      <div class="auth-logo">Know GOD App</div>
      <h2 style="text-align:center;margin-bottom:24px;font-size:1.3rem">Welcome back</h2>

      <div class="alert alert-error" id="error-msg"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" />
      </div>

      <button class="btn btn-primary btn-full" id="login-btn" onclick="handleLogin()">
        Login
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign up</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  redirectIfLoggedIn();

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleLogin();
  });

  async function handleLogin() {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn      = document.getElementById("login-btn");

    hideError("error-msg");

    if (!email || !password) {
      showError("error-msg", "Please fill in all fields.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Logging in...";

    const { ok, data } = await login({ email, password });

    if (ok) {
      saveAuth(data.token, data.user);
      window.location.href = "/index.html";
    } else {
      showError("error-msg", data.message || "Login failed.");
      btn.disabled = false;
      btn.textContent = "Login";
    }
  }
</script>
</body>
</html>
