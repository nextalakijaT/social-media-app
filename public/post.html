<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Know GOD App — Post</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .like-btn {
      background: none;
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .85rem;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all .15s;
      font-weight: 600;
    }
    .like-btn:hover {
      background: #fee2e2;
      color: var(--danger);
      border-color: var(--danger);
    }
    .like-btn.liked {
      background: #fee2e2;
      color: var(--danger);
      border-color: var(--danger);
    }
    .like-btn.liked svg {
      fill: var(--danger);
      stroke: var(--danger);
    }
    .comment-item {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: flex-start;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .comment-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="/index.html" class="navbar-brand">Know GOD App</a>
  <div class="navbar-nav">
    <a href="/index.html" class="nav-link">← Back to Feed</a>
    <a href="/dashboard.html" class="nav-link" id="nav-dashboard" style="display:none">My Posts</a>
    <a href="/create.html" class="nav-link" id="nav-create" style="display:none">+ New Post</a>
    <button class="btn btn-ghost btn-sm" id="nav-logout" style="display:none">Logout</button>
  </div>
</nav>

<div class="container">
  <div id="post-container">
    <div class="spinner"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>

  // ── Navbar setup ───────────────────────────────────────────────────────────
  if (isLoggedIn()) {
    document.getElementById("nav-dashboard").style.display = "";
    document.getElementById("nav-create").style.display    = "";
    document.getElementById("nav-logout").style.display    = "";
  }

  document.getElementById("nav-logout")?.addEventListener("click", () => {
    clearAuth();
    window.location.href = "/index.html";
  });

  // ── Load the post ──────────────────────────────────────────────────────────
  async function loadPost() {
    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) {
      window.location.href = "/index.html";
      return;
    }

    const { ok, data } = await getPost(id);

    if (!ok) {
      document.getElementById("post-container").innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>Post not found</h3>
          <p><a href="/index.html">Go back to the feed</a></p>
        </div>`;
      return;
    }

    const post     = data.data;
    const author   = post.author;
    const initials = author
      ? (author.first_name[0] + author.last_name[0]).toUpperCase()
      : "??";
    const tags = (post.tags || [])
      .map(t => `<span class="tag">#${t}</span>`)
      .join("");

    const currentUser = getUser();
    const isOwner     = currentUser && author && currentUser.id === author._id;

    document.title = `${post.title} — Know GOD App`;

    document.getElementById("post-container").innerHTML = `

      <!-- ── Post Card ─────────────────────────────────────────────────── -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-body">

          <!-- Author header -->
          <div class="post-header" style="margin-bottom:20px">
            <div class="avatar">${initials}</div>
            <div>
              <div class="post-author">
                ${author ? `${author.first_name} ${author.last_name}` : "Unknown"}
                <span style="color:var(--muted);font-weight:400">
                  @${author?.username || ""}
                </span>
              </div>
              <div class="post-date">${formatDate(post.createdAt)}</div>
            </div>
            ${isOwner ? `
              <div style="margin-left:auto;display:flex;gap:8px">
                <a href="/create.html?id=${post._id}" class="btn btn-outline btn-sm">
                  ✏️ Edit
                </a>
                <button class="btn btn-danger btn-sm" onclick="handleDelete('${post._id}')">
                  🗑️ Delete
                </button>
              </div>` : ""}
          </div>

          <!-- Title -->
          <h1 class="post-full-title">${post.title}</h1>

          <!-- Tags -->
          ${tags ? `<div class="post-tags" style="margin:12px 0 20px">${tags}</div>` : ""}

          <!-- Content -->
          <div class="post-full-content">${post.content}</div>

        </div>

        <!-- Like / comment stats bar -->
        <div class="card-footer">

          <!-- Like / Unlike button -->
          <button class="like-btn" id="like-btn" onclick="handleLike('${post._id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06
                a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78
                1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="like-label">Like</span>
            <span style="color:var(--border)">·</span>
            <span id="like-count">${post.like_count}</span>
          </button>

          <!-- Comment count -->
          <span style="color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:4px">
            💬
            <span id="comment-count">${post.comment_count}</span>
            comments
          </span>

        </div>
      </div>

      <!-- ── Comments Card ──────────────────────────────────────────────── -->
      <div class="card">
        <div class="card-body">

          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:20px">
            💬 Comments
            <span style="color:var(--muted);font-weight:400;font-size:.9rem">
              (<span id="comments-total">${post.comment_count}</span>)
            </span>
          </h3>

          <!-- Write a comment (logged in only) -->
          ${isLoggedIn() ? `
            <div style="display:flex;gap:10px;margin-bottom:24px;align-items:flex-start">
              <div class="avatar avatar-sm">
                ${currentUser ? currentUser.username[0].toUpperCase() : "?"}
              </div>
              <div style="flex:1">
                <textarea
                  id="comment-input"
                  class="form-control"
                  rows="3"
                  placeholder="Write a comment..."
                  style="min-height:80px;margin-bottom:10px"
                ></textarea>
                <button
                  class="btn btn-primary btn-sm"
                  id="comment-submit-btn"
                  onclick="handleAddComment('${post._id}')">
                  Post Comment
                </button>
              </div>
            </div>
            <hr style="border:none;border-top:1px solid var(--border);margin-bottom:20px">
          ` : `
            <div style="
              background:var(--bg);
              border-radius:8px;
              padding:16px;
              text-align:center;
              margin-bottom:20px;
              color:var(--muted);
              font-size:.9rem;
              border:1px dashed var(--border)">
              <a href="/login.html">Log in</a> to leave a comment
            </div>
          `}

          <!-- Comments list -->
          <div id="comments-list">
            <div class="spinner"></div>
          </div>

        </div>
      </div>`;

    // ── Check if the user already liked this post ──────────────────────────
    if (isLoggedIn()) {
      const { ok: likeOk, data: likeData } = await checkLike(id);
      if (likeOk && likeData.liked) {
        const likeBtn   = document.getElementById("like-btn");
        const likeLabel = document.getElementById("like-label");
        if (likeBtn)   likeBtn.classList.add("liked");
        if (likeLabel) likeLabel.textContent = "Unlike";
      }
    }

    // ── Load comments ──────────────────────────────────────────────────────
    loadComments(id);
  }

  // ── Like / Unlike handler ──────────────────────────────────────────────────
  async function handleLike(postId) {
    if (!isLoggedIn()) {
      window.location.href = "/login.html";
      return;
    }

    const btn     = document.getElementById("like-btn");
    const label   = document.getElementById("like-label");
    const countEl = document.getElementById("like-count");
    const isLiked = btn.classList.contains("liked");

    // Optimistic UI — update immediately before API responds
    btn.classList.toggle("liked");
    label.textContent   = isLiked ? "Like" : "Unlike";
    countEl.textContent = isLiked
      ? Math.max(0, parseInt(countEl.textContent) - 1)
      : parseInt(countEl.textContent) + 1;

    // Call the API
    const { ok, data } = isLiked
      ? await unlikePost(postId)
      : await likePost(postId);

    if (ok) {
      // Update with the real server count
      countEl.textContent = data.like_count;
    } else {
      // Revert the optimistic update if API failed
      btn.classList.toggle("liked");
      label.textContent   = isLiked ? "Unlike" : "Like";
      countEl.textContent = isLiked
        ? parseInt(countEl.textContent) + 1
        : Math.max(0, parseInt(countEl.textContent) - 1);
      alert(data.message || "Something went wrong. Please try again.");
    }
  }

  // ── Delete Post handler ────────────────────────────────────────────────────
  async function handleDelete(postId) {
    if (!confirm("Are you sure you want to delete this post? This cannot be undone.")) return;
    const { ok } = await deletePost(postId);
    if (ok) window.location.href = "/dashboard.html";
  }

  // ── Load Comments ──────────────────────────────────────────────────────────
  async function loadComments(postId) {
    const list = document.getElementById("comments-list");
    if (!list) return;

    list.innerHTML = '<div class="spinner"></div>';

    const { ok, data } = await getComments(postId);

    if (!ok || !data.data || !data.data.length) {
      list.innerHTML = `
        <div class="empty-state" style="padding:24px 0">
          <div class="icon">💬</div>
          <h3>No comments yet</h3>
          <p>Be the first to share your thoughts!</p>
        </div>`;
      return;
    }

    const currentUser = getUser();

    list.innerHTML = data.data.map((comment) => {
      const initials = comment.author
        ? (comment.author.first_name[0] + comment.author.last_name[0]).toUpperCase()
        : "??";
      const isOwner = currentUser && currentUser.id === comment.author._id;

      return `
        <div class="comment-item" id="comment-${comment._id}">
          <div class="avatar avatar-sm">${initials}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
              <div>
                <span style="font-weight:600;font-size:.9rem">
                  ${comment.author.first_name} ${comment.author.last_name}
                </span>
                <span style="color:var(--muted);font-size:.8rem">
                  &nbsp;@${comment.author.username}&nbsp;·&nbsp;${formatDate(comment.createdAt)}
                </span>
              </div>
              ${isOwner ? `
                <button
                  class="btn btn-danger btn-sm"
                  onclick="handleDeleteComment('${postId}', '${comment._id}')">
                  Delete
                </button>` : ""}
            </div>
            <p style="margin-top:8px;font-size:.92rem;color:#334155;line-height:1.6">
              ${comment.content}
            </p>
          </div>
        </div>`;
    }).join("");
  }

  // ── Add Comment handler ────────────────────────────────────────────────────
  async function handleAddComment(postId) {
    const input     = document.getElementById("comment-input");
    const submitBtn = document.getElementById("comment-submit-btn");
    const content   = input.value.trim();

    if (!content) {
      alert("Please write something before posting.");
      return;
    }

    submitBtn.disabled    = true;
    submitBtn.textContent = "Posting...";

    const { ok, data } = await addComment(postId, content);

    if (ok) {
      input.value           = "";
      submitBtn.disabled    = false;
      submitBtn.textContent = "Post Comment";

      // Update comment counts
      const total = document.getElementById("comments-total");
      const count = document.getElementById("comment-count");
      if (total) total.textContent = data.comment_count;
      if (count) count.textContent = data.comment_count;

      // Reload the comments list
      loadComments(postId);
    } else {
      alert(data.message || "Failed to post comment. Please try again.");
      submitBtn.disabled    = false;
      submitBtn.textContent = "Post Comment";
    }
  }

  // ── Delete Comment handler ─────────────────────────────────────────────────
  async function handleDeleteComment(postId, commentId) {
    if (!confirm("Are you sure you want to delete this comment?")) return;

    const { ok } = await deleteComment(postId, commentId);

    if (ok) {
      // Remove comment from DOM without full reload
      const el = document.getElementById(`comment-${commentId}`);
      if (el) el.remove();

      // Update the counts
      const total = document.getElementById("comments-total");
      const count = document.getElementById("comment-count");
      if (total) total.textContent = Math.max(0, parseInt(total.textContent) - 1);
      if (count) count.textContent = Math.max(0, parseInt(count.textContent) - 1);

      // Show empty state if no comments left
      const list = document.getElementById("comments-list");
      if (list && !list.querySelector(".comment-item")) {
        list.innerHTML = `
          <div class="empty-state" style="padding:24px 0">
            <div class="icon">💬</div>
            <h3>No comments yet</h3>
            <p>Be the first to share your thoughts!</p>
          </div>`;
      }
    } else {
      alert("Failed to delete comment. Please try again.");
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadPost();

</script>
</body>
</html>
